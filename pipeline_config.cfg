# =============================================================================
#  GridCAT Analysis Pipeline — Central Configuration
# =============================================================================
#
#  This is the ONLY file you need to edit before running the pipeline.
#  All scripts read their settings from here.
#
#  HOW TO EDIT:
#    - Lines starting with # are comments (ignored)
#    - Each setting is KEY=VALUE (no spaces around the =)
#    - Paths must be absolute (start with /)
#    - Do NOT put quotes around values
#    - Do NOT leave trailing spaces after values
#
#  After editing, run:    bash run_pipeline.sh
#
# =============================================================================


# =============================================================================
#  1) PATHS — Where is everything on the HPC?
# =============================================================================

# Your BIDS-formatted data directory (contains sub-XX/ses-YY/ folders).
# The pipeline only ever READS from here. Every file it creates or modifies
# goes to the derivatives directory below, so this stays raw.
BIDS_ROOT=/sc-projects/sc-proj-cc02-brainspace/myspace/julius/BRACE_GC_testing/v2_BRACE_ashs/bids

# Where pipeline output goes (GLM directories, results, logs).
# Will be created automatically if it does not exist.
OUTPUT_ROOT=/sc-projects/sc-proj-cc02-brainspace/myspace/julius/BRACE_GC_testing/v2_BRACE_ashs/workDir

# ---- Derivatives: everything the pipeline writes to BIDS-shaped folders ----
#
# The preprocessing copies each input it touches into here and works on the
# copy. That is not only tidiness: SPM's Realign & Unwarp and Coregister write
# the transforms they estimate into the headers of their INPUT images, and
# reading a .nii.gz means leaving a decompressed twin behind. Run any of that
# straight on BIDS_ROOT and the raw data quietly stops being raw.
#
# Leave empty for <OUTPUT_ROOT>/derivatives. Set it to
# <BIDS_ROOT>/derivatives if you prefer the canonical BIDS location and your
# BIDS directory is writable.
DERIV_ROOT=

# The three datasets inside it. Each is a BIDS derivatives dataset of its own
# (sub-XX/ses-YY/{anat,func,fmap} plus a dataset_description.json):
#
#   DERIV_PREPROC    everything SPM produces. Regenerated from scratch on every
#                    full preprocessing run — see DERIV_RESET below.
#   DERIV_ROIS       ROI masks imported by move_rois.sh. Kept: they come from
#                    manual segmentation and re-importing them is your call.
#   DERIV_FIELDMAPS  fieldmaps built by make_fieldmaps.sh. Kept: rebuilding
#                    them means another FSL run (use its --force).
DERIV_PREPROC=spm-preproc
DERIV_ROIS=rois
DERIV_FIELDMAPS=fieldmaps

# When to clear the preprocessing derivatives so no old data survives a re-run:
#   auto    clear whenever the run starts the preprocessing from its beginning
#           (stages "all", or a list containing the first stage your
#           PREPROC_MODE performs). A resumed run — realign,coreg,smooth or
#           just smooth — keeps what is there, because that is its input.
#   always  clear on every run, including partial ones. Resuming stops working.
#   never   never clear; new output overwrites old file by file, and anything
#           that is no longer produced stays behind.
DERIV_RESET=auto

# Variant name for this run. Controls the GridCAT output folder name:
#   empty            → OUTPUT_ROOT/GLM_output        (default, backwards compatible)
#   <variant>        → OUTPUT_ROOT/GLM_output_<variant>
#
# Use this to run several GridCAT analyses in parallel with different settings.
# Each submission takes a snapshot of pipeline_config.cfg, so it is safe to edit
# this file and submit the next variant while the previous job is still running.
#
# Allowed characters: letters, digits, underscore, dash, dot. Other characters
# are replaced with underscores in the folder name.
RUN_VARIANT=6f_t5_am_keep1_avg_1

# Where this script directory (j_scripts) lives.
SCRIPT_DIR=/sc-projects/sc-proj-cc02-brainspace/myspace/julius/BRACE_GC_testing/v2_BRACE_ashs/scripts_v2

# SPM installation directory (the folder that contains spm.m).
SPM_DIR=/sc-projects/sc-proj-cc02-brainspace/software/matlab/spm25

# GridCAT toolbox directory (the folder containing specifyGLM.m).
GRIDCAT_DIR=/sc-projects/sc-proj-cc02-brainspace/myspace/julius/sirius_wip/GridCAT

# CircStat toolbox directory (ships with GridCAT; used for Rayleigh tests).
# Leave empty to auto-detect as GRIDCAT_DIR/CircStat2012a
CIRCSTAT_DIR=


# =============================================================================
#  2) ACQUISITION PARAMETERS — Must match your MRI protocol
# =============================================================================
#  CRITICAL: Wrong values = silently wrong results. Double-check against your
#  BIDS JSON sidecar files (in fmap/ and func/).

# Total EPI readout time in MILLISECONDS.
# Check func/*_bold.json -> "TotalReadoutTime" (BIDS stores seconds;
# multiply by 1000 to convert). Example: 0.034775 s -> 34.775 ms
TOTAL_READOUT_MS=34.775

# Echo times for the GRE fieldmap (phasediff), in MILLISECONDS.
# Check fmap/*_phasediff.json -> "EchoTime1" and "EchoTime2"
# (BIDS stores seconds; multiply by 1000).
TE_SHORT_MS=4.92
TE_LONG_MS=7.38

# Blip direction for SPM FieldMap distortion correction (+1 or -1).
# Depends on phase-encode direction in your acquisition.
# Check BIDS JSON "PhaseEncodingDirection": j -> typically +1, j- -> typically -1
# Probably the task value is needed, not the fmap
BLIP_DIRECTION=-1

# Repetition time (TR) in SECONDS. (I believe this is for GridCat so from the task not fmap)
TR=2

# Fieldmap type: 0 = non-EPI (magnitude + phasediff), 1 = EPI-based
EPI_BASED_FIELDMAP=1


# =============================================================================
#  3) STUDY DESIGN — What does your experiment look like?
# =============================================================================

# Which task labels to process (comma-separated, no spaces).
# Must match the task-<LABEL> in your BIDS filenames.
# Examples:
#   1,2,3       → task-1, task-2, task-3
#   run1,run2   → task-run1, task-run2
TASKS=run1,run2

# Preprocessing mode:
#   realign_unwarp   = motion + distortion correction from a GRE fieldmap
#                      (needs phasediff + magnitude1 in fmap/; SPM unwraps the phase)
#   topup            = motion + distortion correction using FSL topup (reverse-PE EPIs)
#   precalc_fieldmap = motion + distortion correction from a ready-made B0 fieldmap
#                      (needs <sub>_<ses>_fieldmap + _magnitude in fmap/).
#                      Use this when the session has a phasediff but NO magnitude
#                      image: bash make_fieldmaps.sh builds the fieldmap from the
#                      T1w + phasediff with FSL, then this mode consumes it.
#   realign_only     = motion correction only (no fieldmaps needed)
PREPROC_MODE=topup

# Which preprocessing stages to run (comma-separated, no spaces).
# The SPM preprocessing is split into five stages that can be run on their own,
# so you can stop after any of them, check or replace the intermediate files,
# and resume later:
#
#   topup     Estimate the distortion field with FSL topup.
#             Writes func/topup_results_* and func/topup_acqparams.txt.
#             Does nothing unless PREPROC_MODE=topup.
#   vdm       Build one voxel displacement map per task: func/vdm_task-<N>.nii.
#             Does nothing for realign_only, or for topup+applytopup.
#   realign   Apply the correction + motion correction. Writes u*_bold.nii,
#             rp_*.txt, the per-task means and meanu_session.nii.
#   coreg     Coregister T2w -> session mean, reslice ROI masks (r*_mask.nii).
#   smooth    Gaussian smoothing of the preprocessed BOLD (su*_bold.nii).
#
# Shorthands: all, fieldmap (= topup,vdm), post_fieldmap (= realign,coreg,smooth)
#
# Examples:
#   all                          -> the complete preprocessing (default)
#   fieldmap                     -> only estimate the fields, stop there
#   vdm,realign,coreg,smooth     -> resume from topup output made elsewhere
#   realign,coreg,smooth         -> resume from ready-made vdm_task-<N>.nii
#   smooth                       -> re-smooth with a different SMOOTH_FWHM
#
# This is the default for every run. Individual submissions can override it:
#   bash submit_preproc.sh --stages realign,coreg,smooth
PREPROC_STAGES=all

# Coregister T2w -> EPI and reslice ROI masks into EPI space? (1=yes, 0=skip)
DO_COREG_ROIS=1

# ROI mask filename patterns (in anat/ folder).
# Pipeline looks for files containing these substrings.
# The pipeline tolerates extra BIDS entities (run-N, acq-*, etc.)
ROI_PATTERN_LEFT=_hemi-left_label-ErC_mask.nii
ROI_PATTERN_RIGHT=_hemi-right_label-ErC_mask.nii

# Source directory for manual ROI segmentations (used by move_rois.sh).
# Files are expected to be named: sub-XX_ses-YY_[run-N_]<LABEL>_<hemi>.nii[.gz]
# Example: sub-01s13_ses-01_ErC_left.nii.gz
ROI_SOURCE_DIR=/sc-projects/sc-proj-cc02-brainspace/myspace/julius/BRACE_GC_testing/v2_pipe_t5_data/ROI_lucie/ErC_ROIs_BIDS

# ROI label used in source filenames (the part between sub/ses and hemisphere).
# Example: for "sub-01s13_ses-01_ErC_left.nii.gz", this is "ErC"
ROI_SOURCE_LABEL=ErC

# ---- Multiple runs of the same scan ----
#
# A session can hold several runs of a T1w, T2w, task, fieldmap, magnitude or
# reverse-PE EPI. Run numbers are counted per modality and say nothing across
# modalities: if the subject climbed out of the scanner between sequences,
# run-2 of the T2w and run-2 of a task are from different visits and pairing
# them coregisters the wrong anatomy.
#
# The pipeline decides in this order:
#   1. Your choice in RUN_SELECTION_FILE.
#   2. The run acquired closest in time to the BOLD being preprocessed, read
#      from AcquisitionTime in the JSON sidecars.
#   3. Nothing else is safe — see STRICT_RUN_MATCHING.

# Run selection file for multi-run cases.
# Generated by: bash scan_multirun.sh   (which lists every run with its
# acquisition time and pre-fills a suggestion you can correct)
# Leave empty to rely on acquisition-time matching alone.
RUN_SELECTION_FILE=/sc-projects/sc-proj-cc02-brainspace/myspace/julius/BRACE_GC_testing/v2_BRACE_ashs/scripts_v2/run_selection.tsv

# How far apart two scans may be acquired and still count as the same visit to
# the scanner, in minutes. Runs further apart than this are treated as separate
# blocks. Raise it for long protocols, lower it if your subjects take breaks
# inside the scanner between blocks.
RUN_MATCH_GAP_MIN=20

# What to do when several runs exist and neither the selection file nor the
# acquisition times can decide between them:
#   true   stop and say so. Silently pairing the wrong T2w with a task is a
#          result you cannot spot afterwards, so this is the default.
#   false  take the highest run number and print a loud warning.
STRICT_RUN_MATCHING=true

# ROI analysis mode for GridCAT GLM2:
#   both        = bilateral AND separate left/right (most complete)
#   bilat_only  = only bilateral combined mask
#   lr_only     = only separate left and right masks
ROI_MODE=both

# Tasks to EXCLUDE from GridCAT analysis (comma-separated, or leave empty).
# Common exclusions: rest, reverse
EXCLUDE_TASKS=rest,reverse,mean

# ---- Subject/Session Filtering ----
# Applied by filter_subses_list.sh (run after step 0, before preprocessing).
# All filters are optional. Leave empty to include everything.
#
# INCLUDE = whitelist (keep ONLY these). EXCLUDE = blacklist (remove these).
# Include is applied first, then exclude removes from the result.
#
# Examples:
#   INCLUDE_SUBJECTS=sub-01s13,sub-02s13,sub-03s13
#   INCLUDE_SESSIONS=ses-01,ses-04
#   EXCLUDE_SUBJECTS=sub-07s13
#   EXCLUDE_SESSIONS=ses-03,ses-05
INCLUDE_SUBJECTS=
INCLUDE_SESSIONS=
EXCLUDE_SUBJECTS=
EXCLUDE_SESSIONS=

# Only keep subject-session pairs that have ROI masks in anat/.
# Checks for files matching ROI_PATTERN_LEFT or ROI_PATTERN_RIGHT.
# Set to true to skip subjects without ROIs (saves preprocessing time).
REQUIRE_ROI=true


# =============================================================================
#  4) SPM PREPROCESSING SETTINGS (advanced)
# =============================================================================
#  Defaults work well for most studies. Only change if you have reason to.

# --- Realign & Unwarp estimation ---
REALIGN_QUALITY=1
REALIGN_SEP=4
REALIGN_FWHM=5
REALIGN_RTM=1
REALIGN_EINTERP=4
REALIGN_EWRAP=0,1,0

# --- Unwarp estimation ---
UNWARP_BASFCN=12,12
UNWARP_REGORDER=1
UNWARP_LAMBDA=100000
UNWARP_JM=3
UNWARP_FOT=4,5
UNWARP_SOT=
UNWARP_UWFWHM=2
UNWARP_REM=1
UNWARP_NOI=5
UNWARP_EXPROUND=Average

# --- Reslice options ---
# WHICH: [2 1] = write resliced images + mean image
RESLICE_WHICH=2,1
RESLICE_INTERP=6
RESLICE_WRAP=0,0,0
RESLICE_MASK=0
RESLICE_PREFIX=u

# --- VDM / FieldMap ---
VDM_WRAP=0,1,0
VDM_MASK=1
VDM_MASKBRAIN=1
VDM_UFLAGS_METHOD=Mark3D
VDM_UFLAGS_FWHM=5
VDM_UFLAGS_PAD=0
VDM_UFLAGS_WS=1

# --- FSL Topup (only used when PREPROC_MODE=topup) ---
# FSL module name (used in: module load <this>)
FSL_MODULE=fsl/6.0.7.18

# Phase-encoding direction of your BOLD task EPIs.
# Use FSL convention: x, x-, y, y-, z, z-
# Check BIDS JSON "PhaseEncodingDirection":
#   i = x,  i- = x-,  j = y,  j- = y-,  k = z,  k- = z-
TOPUP_PE_DIR_BOLD=y

# Phase-encoding direction of the reverse-PE EPI (opposite of BOLD).
# If BOLD is "x", reverse is typically "x-" (and vice versa).
TOPUP_PE_DIR_REVERSE=y-

# Total readout time in SECONDS for the acqparams file.
# Check BIDS JSON "EstimatedTotalReadoutTime" (already in seconds).
# This may differ from TOTAL_READOUT_MS (which is for GRE fieldmaps).
TOPUP_READOUT_SEC=0.05409

# Where to look for the reverse-PE EPI:
#   fmap   = only look in fmap/ directory (standard BIDS)
#   func   = only look in func/ directory (e.g., task-reverse)
#   auto   = search fmap/ first, then func/ (recommended)
TOPUP_REVERSE_PE_DIR=func

# Filename pattern for the reverse-PE EPI (substring match, case-sensitive).
# The pipeline searches for NIfTI files containing this pattern.
# Extra BIDS entities (acq-, run-, etc.) between specifiers are tolerated.
#
# Examples:
#   dir-RL_epi          (reverse-PE EPI in fmap/, BOLD is L-R)
#   dir-PA_epi          (reverse-PE EPI in fmap/, BOLD is A-P)
#   task-reverse_bold   (reverse EPI stored as a task in func/)
#   dir-RL              (broader match — any file with dir-RL)
TOPUP_REVERSE_PE_PATTERN=task-reverse_bold

# FSL topup configuration file (blank = FSL default b02b0.cnf).
# Provide a full path to a custom CNF file, or leave empty for default.
TOPUP_CONFIG=

# Pre-computed FSL topup output — only used when the "topup" stage is NOT run.
# Set this if you estimated the fields yourself (outside this pipeline) and
# uploaded them to the cluster. Give the topup output PREFIX, i.e. the path
# without the _fieldcoef.nii.gz / _movpar.txt / _field.nii.gz suffix.
# {SUB} and {SES} are replaced with the subject and session being processed.
#
# Example layout:
#   /path/to/topup/sub-01s13/ses-01/topup_results_fieldcoef.nii.gz
#                                   topup_results_movpar.txt
#                                   topup_results_field.nii.gz
#   -> TOPUP_EXISTING_PREFIX=/path/to/topup/{SUB}/{SES}/topup_results
#
# Leave empty to look in the session's own func/ directory (func/topup_results),
# which is also where the pipeline's own topup stage writes.
TOPUP_EXISTING_PREFIX=

# How to apply the topup correction:
#   applytopup  = use FSL applytopup to correct EPIs, then SPM Realign only
#   vdm         = convert topup fieldmap to SPM VDM, then SPM Realign&Unwarp
TOPUP_APPLY_METHOD=vdm

# Interpolation method for applytopup (spline or trilinear).
TOPUP_INTERP=spline

# --- Fieldmap from structural (make_fieldmaps.sh) ---
# Used when a session has a phase-difference image but no magnitude image, so
# fsl_prepare_fieldmap has nothing to unwrap against. make_fieldmaps.sh builds
# the missing magnitude out of the T1w (bet -> flirt into the phasediff grid ->
# mask), then writes, per session:
#
#   fmap/<sub>_<ses>[_run-N]_fieldmap.nii[.gz]    the fieldmap, in rad/s
#   fmap/<sub>_<ses>[_run-N]_magnitude.nii[.gz]   the brain-only magnitude
#   fmap/<sub>_<ses>[_run-N]_fieldmap.json        units, IntendedFor, provenance
#
# Run it with:  bash make_fieldmaps.sh --dry-run     (then without --dry-run)
# Then set PREPROC_MODE=precalc_fieldmap above.

# Scanner vendor, passed straight to fsl_prepare_fieldmap (SIEMENS or PHILIPS).
FIELDMAP_SCANNER=SIEMENS

# Echo time difference in MILLISECONDS for fsl_prepare_fieldmap.
# Leave empty to read it per session from the phasediff JSON
# (EchoTime2 - EchoTime1), which is the safest option.
FIELDMAP_DELTA_TE=

# Fractional intensity threshold for bet (lower = keeps more brain).
FIELDMAP_BET_F=0.5

# Where the magnitude for fsl_prepare_fieldmap comes from:
#   structural = always build it from the T1w (default). Every session is
#                processed identically, which matters when you compare sessions.
#   auto       = use the session's real *_magnitude1 image when it has one, and
#                fall back to the T1w otherwise. Better per session, but mixes
#                two kinds of magnitude across a longitudinal dataset.
FIELDMAP_MAGNITUDE_SOURCE=structural

# ---- Reading fieldmaps back in (PREPROC_MODE=precalc_fieldmap) ----

# Filename patterns the preprocessing looks for in fmap/. Extra BIDS entities
# such as run-N are tolerated. Write these WITHOUT the file extension — unlike
# ROI_PATTERN_LEFT/RIGHT above, the .nii/.nii.gz is added by the search.
FIELDMAP_PATTERN=_fieldmap
FIELDMAP_MAGNITUDE_PATTERN=_magnitude

# Units of the fieldmap on disk. fsl_prepare_fieldmap writes rad/s; SPM's
# FieldMap toolbox wants Hz, so rad/s is divided by 2*pi before it is used.
# Getting this wrong scales the whole distortion correction by 2*pi.
#   rad/s = output of fsl_prepare_fieldmap (default)
#   Hz    = fieldmap already converted to Hz
FIELDMAP_UNITS=rad/s

# NOTE for precalc_fieldmap mode: set EPI_BASED_FIELDMAP=0 (section 2) — a
# fieldmap made from a GRE phasediff is not EPI-based. Also consider
# VDM_MASKBRAIN=0, since make_fieldmaps.sh already writes a brain-only
# magnitude and SPM would otherwise mask it a second time.

# --- Coregistration ---
COREG_COST_FUN=nmi
COREG_SEP=4,2,1
COREG_FWHM=7,7
# Interpolation for ROI reslicing: 0 = nearest neighbor (correct for label masks)
COREG_ROI_INTERP=0

# --- Spatial smoothing (optional) ---
# Gaussian smoothing kernel FWHM in mm (isotropic).
# Set to 0 to skip smoothing (default). Common values: 4, 6, 8 mm.
SMOOTH_FWHM=5

# Prefix prepended to smoothed files (SPM default: s)
SMOOTH_PREFIX=s


# =============================================================================
#  5) GRIDCAT GLM SETTINGS
# =============================================================================

# Fold symmetry: 6 = hexagonal grid cells (standard), 4 = square
X_FOLD_SYMMETRY=6

# SPM masking threshold (0 to 1). Higher = stricter signal mask.
MASKING_THRESHOLD=0.8

# SPM microtime settings
MICROTIME_ONSET=8
MICROTIME_RESOLUTION=16

# HRF derivatives: 0,0 = none, 1,0 = temporal only, 1,1 = temporal+dispersion
DERIVATIVES=0,0

# High-pass filter cutoff in seconds.
HPF_CUTOFF=128

# Display SPM design matrix during GLM? 0=no (for batch), 1=yes (for debugging)
DISPLAY_DESIGN=0

# GridCAT event usage specifiers (leave at defaults unless you know better)
EVENT_USAGE_GLM1=4
EVENT_USAGE_GLM2=5
KEEP_UNUSED_GRID_EVENTS=1
USE_VOXEL_WEIGHTING=1
AVG_ORI_ACROSS_RUNS=1
GLM2_REGRESSOR_METHOD=aligned_misaligned

# Which type of regressor should be included for grid events?
#   'pmod' ... one regressor with a parametric modulation
#   'aligned_misaligned' ... one regressor for events that are aligned with the mean grid orientation
#                            and one regressor for misaligned events
#   'aligned_misaligned_multiple' ... one regressor for each orientation, for which either a positive peak (for aligned events)
#                                     or a negative peak (for misaligned events) in the BOLD signal is expected 

# File prefixes after preprocessing (these MUST match what SPM produces)
# If SMOOTH_FWHM > 0, change FUNC_PREFIX to su (smooth prefix + reslice prefix)
FUNC_PREFIX=su
ROI_PREFIX=r


# =============================================================================
#  6) SLURM / HPC SETTINGS
# =============================================================================

# SLURM partition (check your HPC: sinfo -s)
SLURM_PARTITION=compute

# Email address for SLURM job notifications. Leave empty to disable emails.
# When set, you receive exactly two emails per full "Run ALL steps" chain:
#   1) after ALL preprocessing array tasks finish (one mail for the whole array)
#   2) after the GridCAT analysis finishes
# The intermediate prep stage does not send email. FAIL notifications are also
# sent so you learn if the chain halts.
NOTIFY_EMAIL=

# MATLAB module name (used in: module load <this>)
MATLAB_MODULE=matlab

# How the "Run ALL steps" option chains the SLURM jobs (preproc -> prep -> GLM).
# The whole pipeline is queued at once and SLURM runs each stage automatically
# once the previous one finishes — no need to babysit between stages.
#   afterok   = next stage runs only if ALL tasks of the previous stage
#               succeeded (safest; one failed subject halts the chain)
#   afterany  = next stage runs once the previous stage finishes, regardless
#               of exit status (matches FAIL_ON_MISSING=false — process
#               whatever succeeded and skip the rest)
CHAIN_DEPENDENCY=afterok

# --- Preprocessing job (per subject-session, submitted as array job) ---
PREPROC_TIME=10:00:00
PREPROC_CPUS=2
PREPROC_MEM_PER_CPU=8G

# --- GridCAT preparation job (currently parallelized per subject-session) ---
PREP_TIME=01:00:00
PREP_CPUS=10
PREP_MEM=40G

# --- GridCAT analysis job ---
# Check if mem is per job or total in batch script
GRIDCAT_TIME=01:00:00
GRIDCAT_CPUS=30
GRIDCAT_MEM=80G

# Parallel MATLAB workers inside GridCAT job.
# Capped at number of subject-sessions at runtime (no idle workers).
# Rule of thumb: GRIDCAT_CPUS minus 1.
MAX_WORKERS=29

# Stage data to node-local scratch to bypass NFS I/O bottleneck?
# When true, input data is copied to node-local /tmp before processing,
# GLM output is written locally, and results are copied back to NFS at the end.
# Should be faster when input/output would otherwise go through network storage.
# GridCat is still taking about 30 min compared to around 5 on the Threadripper
USE_LOCAL_SCRATCH=true

# Amount of local tmp storage to request from SLURM (--gres=tmp:SIZE).
# Must be larger than your GLM_runauto directory (~13G) plus expected output.
# Leave empty to skip the --gres request (uses whatever /tmp is available).
GRIDCAT_LOCAL_TMP=80G

# Where to stage data on the local node (leave empty for SLURM $TMPDIR or /tmp).
LOCAL_SCRATCH_BASE=


# =============================================================================
#  7) PIPELINE BEHAVIOR
# =============================================================================

# Copy or symlink files into GridCAT directory?
#   copy    = safer (uses more disk space)
#   symlink = saves space (breaks if source files move)
COPY_MODE=copy

# Stop immediately on first missing file? (true/false)
#   true  = strict mode — pipeline stops to let you fix it
#   false = skip that subject and continue with the rest
FAIL_ON_MISSING=false

# Dry-run mode — show what WOULD happen without doing it (true/false).
# Great for checking your configuration before running.
DRY_RUN=false
